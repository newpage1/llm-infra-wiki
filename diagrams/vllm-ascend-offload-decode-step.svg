<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:606px;height:721px;background:#FFFDF8;" width="606px" height="721px" viewBox="0 0 606 721" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="606" height="721" fill="#FFFDF8" style="stroke:none;"/><g class="title" data-source-line="18"><text x="196.996" y="33.535" fill="#000" font-size="14" textLength="210.171" font-weight="700" font-family="'IBM Plex Sans'">一个 Decode Step 内的七个步骤</text></g><ellipse cx="172.268" cy="62.488" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="16" y="82.488" width="570.163" height="576.733" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M296.915,82.488 L296.915,91.977 L286.915,101.977 L16,101.977" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="19" y="97.023" fill="#000" font-size="14" textLength="270.915" font-family="'IBM Plex Sans'">每个 Decode Step（循环执行到生成结束）</text><path d="M317.332,118.977 L317.332,142.942 L297.332,146.942 L317.332,150.942 L317.332,174.908 A0,0 0 0 0 317.332,174.908 L509.078,174.908 A0,0 0 0 0 509.078,174.908 L509.078,128.977 L499.078,118.977 L317.332,118.977 A0,0 0 0 0 317.332,118.977" style="stroke:#C9B9A2;stroke-width:0.5;" fill="#FEFFDD"/><path d="M499.078,118.977 L499.078,128.977 L509.078,128.977 L499.078,118.977" style="stroke:#C9B9A2;stroke-width:0.5;" fill="#FEFFDD"/><text x="323.332" y="136.545" fill="#000" font-size="13" textLength="26" font-weight="700" font-family="'IBM Plex Sans'">图例</text><text x="323.332" y="151.855" fill="#000" font-size="13" textLength="167.699" font-family="'IBM Plex Sans'">蓝 = 在 NPU（HBM）上执行</text><text x="323.332" y="167.166" fill="#000" font-size="13" textLength="170.746" font-family="'IBM Plex Sans'">橙 = 跨设备搬运 / 落到 Host</text><rect x="47.204" y="121.632" width="250.128" height="50.621" fill="#EAF3FF" style="stroke:#C9B9A2;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="57.204" y="144.2" fill="#2B241B" font-size="13" textLength="230.128" font-family="'IBM Plex Sans'">① pre-attn：qkv_proj / norm / rope</text><text x="57.204" y="159.511" fill="#2B241B" font-size="13" textLength="123.9" font-family="'IBM Plex Sans'">算出新 token 的 K/V</text><path d="M338.537,192.253 L338.537,223.874 L318.537,227.874 L338.537,231.874 L338.537,263.495 A0,0 0 0 0 338.537,263.495 L576.163,263.495 A0,0 0 0 0 576.163,263.495 L576.163,202.253 L566.163,192.253 L338.537,192.253 A0,0 0 0 0 338.537,192.253" style="stroke:#C9B9A2;stroke-width:0.5;" fill="#FEFFDD"/><path d="M566.163,192.253 L566.163,202.253 L576.163,202.253 L566.163,192.253" style="stroke:#C9B9A2;stroke-width:0.5;" fill="#FEFFDD"/><text x="344.537" y="209.821" fill="#000" font-size="13" textLength="35.636" font-weight="700" font-family="'IBM Plex Sans'">[差异]</text><text x="384.286" y="209.821" fill="#000" font-size="13" textLength="133.732" font-family="'IBM Plex Sans'">RFC #33980 原设计是</text><text x="344.537" y="225.132" fill="#000" font-size="13" textLength="204.763" font-family="'IBM Plex Sans'">「先写常规块、再整块 offload」；</text><text x="344.537" y="240.442" fill="#000" font-size="13" textLength="188.862" font-family="'IBM Plex Sans'">main 更激进：decode 根本没有</text><text x="344.537" y="255.753" fill="#000" font-size="13" textLength="216.626" font-family="'IBM Plex Sans'">NPU main cache，新 K/V 直接 D2H</text><rect x="26" y="194.908" width="292.537" height="65.932" fill="#FFF0D9" style="stroke:#C9B9A2;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="217.477" fill="#2B241B" font-size="13" textLength="58.03" font-family="'IBM Plex Sans'">② 新 K/V</text><text x="98.144" y="217.477" fill="#2B241B" font-size="13" textLength="26" font-weight="700" font-family="'IBM Plex Sans'">不写</text><text x="128.257" y="217.477" fill="#2B241B" font-size="13" textLength="144.085" font-family="'IBM Plex Sans'">NPU 分页 main cache，</text><text x="36" y="232.787" fill="#2B241B" font-size="13" textLength="220.53" font-family="'IBM Plex Sans'">直接 D2H 写到 host pool 的逻辑槽位</text><text x="36" y="248.098" fill="#2B241B" font-size="13" textLength="272.537" font-family="'IBM Plex Sans'">（TP rank0 写共享 pool，GVA 广播给全 TP）</text><rect x="46.639" y="283.495" width="251.258" height="50.621" fill="#EAF3FF" style="stroke:#C9B9A2;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="56.639" y="306.063" fill="#2B241B" font-size="13" textLength="231.258" font-family="'IBM Plex Sans'">③ indexer 选出逻辑 top-k token 位置</text><text x="56.639" y="321.374" fill="#2B241B" font-size="13" textLength="173.729" font-family="'IBM Plex Sans'">（indexer cache 常驻 NPU）</text><rect x="66.663" y="354.116" width="211.21" height="81.242" fill="#EAF3FF" style="stroke:#C9B9A2;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="76.663" y="376.685" fill="#2B241B" font-size="13" textLength="123.386" font-family="'IBM Plex Sans'">④ LRU 驻留表判定：</text><text x="76.663" y="391.995" fill="#2B241B" font-size="13" textLength="119.399" font-family="'IBM Plex Sans'">hit → 已在热 buffer</text><text x="76.663" y="407.306" fill="#2B241B" font-size="13" textLength="128.375" font-family="'IBM Plex Sans'">miss → 分配物理热槽</text><text x="76.663" y="422.616" fill="#2B241B" font-size="13" textLength="191.21" font-family="'IBM Plex Sans'">（热 buffer 满 → 按 LRU 淘汰）</text><rect x="41.085" y="455.358" width="262.366" height="50.621" fill="#FFF0D9" style="stroke:#C9B9A2;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="51.085" y="477.927" fill="#2B241B" font-size="13" textLength="242.366" font-family="'IBM Plex Sans'">⑤ 仅 miss 行从 host H2D 拷入热 buffer</text><text x="51.085" y="493.237" fill="#2B241B" font-size="13" textLength="217.229" font-family="'IBM Plex Sans'">（搬运量 ∝ miss 数，而非序列长度）</text><rect x="62.41" y="525.979" width="219.716" height="50.621" fill="#EAF3FF" style="stroke:#C9B9A2;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="72.41" y="548.548" fill="#2B241B" font-size="13" textLength="199.716" font-family="'IBM Plex Sans'">⑥ 逻辑 top-k 位置 → 物理热槽位</text><text x="72.41" y="563.858" fill="#2B241B" font-size="13" textLength="39" font-family="'IBM Plex Sans'">重映射</text><rect x="51.267" y="596.601" width="242.003" height="50.621" fill="#EAF3FF" style="stroke:#C9B9A2;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="61.267" y="619.169" fill="#2B241B" font-size="13" textLength="222.003" font-family="'IBM Plex Sans'">⑦ 在热 buffer 上跑 sparse attention</text><text x="61.267" y="634.479" fill="#2B241B" font-size="13" textLength="182" font-family="'IBM Plex Sans'">（驻留元数据留给下一步复用）</text><ellipse cx="172.268" cy="690.222" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="172.268" cy="690.222" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="172.268" y1="172.253" x2="172.268" y2="194.908" style="stroke:#8A7A67;stroke-width:1;"/><polygon points="168.268,184.908,172.268,194.908,176.268,184.908,172.268,188.908" fill="#8A7A67" style="stroke:#8A7A67;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="172.268" y1="260.84" x2="172.268" y2="283.495" style="stroke:#8A7A67;stroke-width:1;"/><polygon points="168.268,273.495,172.268,283.495,176.268,273.495,172.268,277.495" fill="#8A7A67" style="stroke:#8A7A67;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="172.268" y1="334.116" x2="172.268" y2="354.116" style="stroke:#8A7A67;stroke-width:1;"/><polygon points="168.268,344.116,172.268,354.116,176.268,344.116,172.268,348.116" fill="#8A7A67" style="stroke:#8A7A67;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="172.268" y1="435.358" x2="172.268" y2="455.358" style="stroke:#8A7A67;stroke-width:1;"/><polygon points="168.268,445.358,172.268,455.358,176.268,445.358,172.268,449.358" fill="#8A7A67" style="stroke:#8A7A67;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="172.268" y1="505.979" x2="172.268" y2="525.979" style="stroke:#8A7A67;stroke-width:1;"/><polygon points="168.268,515.979,172.268,525.979,176.268,515.979,172.268,519.979" fill="#8A7A67" style="stroke:#8A7A67;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="172.268" y1="576.601" x2="172.268" y2="596.601" style="stroke:#8A7A67;stroke-width:1;"/><polygon points="168.268,586.601,172.268,596.601,176.268,586.601,172.268,590.601" fill="#8A7A67" style="stroke:#8A7A67;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="172.268" y1="72.488" x2="172.268" y2="121.632" style="stroke:#8A7A67;stroke-width:1;"/><polygon points="168.268,111.632,172.268,121.632,176.268,111.632,172.268,115.632" fill="#8A7A67" style="stroke:#8A7A67;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="172.268" y1="647.222" x2="172.268" y2="679.222" style="stroke:#8A7A67;stroke-width:1;"/><polygon points="168.268,669.222,172.268,679.222,176.268,669.222,172.268,673.222" fill="#8A7A67" style="stroke:#8A7A67;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><?plantuml-src TLHTKnfN6BxdLxoZTynaefWcsgQP0P7QQPDnOfARskbis8DiWLswkoPfCvcXLH0Y-974-acLLkD78vfCEX11-2-wv-novL_8ksT90v5SiUSzptdUvtdEoz4YaXmNL246MbWGbOUIF0uX8QeHb_R_ZaX2maHK3oYoVak84UZwrdSJHgBa4OmAijRLWhml12FZgZ8XYuDAL56XEn08-0FzBGXP4Ob6uj1xfQMe2dB4BlRrj1G5LLKUDcdwlTUyLw-rRWPrwO6a_mgFNG2-ptJ57KKLYTgi3Wxu1hmUhDf6cZMFptEbrzUiZKg_4UZjmvLV4cAAB7OYlZhqHGkW0_-JDhSwkKWoXFBydw8wCBbqIOyICCe9exmFVXB4x61Knw1eAcckJXdbITnW1zkD_IsNIzC5LNUva1AFIOeCNUnmxfE3vzKqhUsRiuSiisCLiZHzPBxOOEbvi_ASvJVEgvak7kYNfmkR45V99K7NvVFgwY-H1p_5LULdk8nQrHZ-g4gSZCbcSObE7xC_Zq1N8aG6r0JVNRxt5Lo_tZta3VG50ZTk89tj3rHfFApZ0i3jfcirepRZTlEbzJmFNmDTtuLR8tTHuB3l9WenoayTZHp3zbOGOvLshMADRasp-LTMVHvbMFCdw0665Ssc9hB8UxaS2mMmbQ4Ux6YKSpIrudRRFO2cKut2Vn0J91c2GZ1CpgjPDBFsbirkWzypZF6ksBHXf8MueaHjOur4nQeji9qJuoGtXg6axupmkUtXwEHhu_XVZaMkR-vvWRwhisS7PWMtTk7E23hYgU00zVW7EgVo0oqLQVMF7r7bxS0WTFVr3VGZ--m6chQA1RPyo85dYInDfkscvRArCqNpIsU9tsagnnRVuZSeeL1K4SIpHEwykiOFS9yCtTKJLdqDhrDq1e9jlcFhhzYR0blFSA2TJLie7_Bx6Ct5bFy6IHR98w928v71QN