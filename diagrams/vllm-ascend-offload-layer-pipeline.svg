<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:462px;height:716px;background:#FFFDF8;" width="462px" height="716px" viewBox="0 0 462 716" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="462" height="716" fill="#FFFDF8" style="stroke:none;"/><g class="title" data-source-line="23"><text x="111.254" y="33.535" fill="#000" font-size="14" textLength="237.508" font-weight="700" font-family="'IBM Plex Sans'">layer i 的执行流水：5 步 + 重叠回边</text></g><ellipse cx="137.493" cy="62.488" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="86.856" y="92.488" width="101.275" height="35.311" fill="#FFFDF8" style="stroke:#C9B9A2;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="96.856" y="115.057" fill="#2B241B" font-size="13" textLength="81.275" font-family="'IBM Plex Sans'">layer i 进入前</text><rect x="20.856" y="147.799" width="233.275" height="50.621" fill="#FFFDF8" style="stroke:#C9B9A2;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="30.856" y="170.367" fill="#2B241B" font-size="13" textLength="213.275" font-family="'IBM Plex Sans'">1. 需要则从 Memcache load 前缀层</text><text x="30.856" y="185.678" fill="#2B241B" font-size="13" textLength="146.796" font-family="'IBM Plex Sans'">（wait_for_layer_load）</text><path d="M264.016,215.765 L264.016,239.73 L244.016,243.73 L264.016,247.73 L264.016,271.696 A0,0 0 0 0 264.016,271.696 L441.016,271.696 A0,0 0 0 0 441.016,271.696 L441.016,225.765 L431.016,215.765 L264.016,215.765 A0,0 0 0 0 264.016,215.765" style="stroke:#C9B9A2;stroke-width:0.5;" fill="#FEFFDD"/><path d="M431.016,215.765 L431.016,225.765 L441.016,225.765 L431.016,215.765" style="stroke:#C9B9A2;stroke-width:0.5;" fill="#FEFFDD"/><text x="270.016" y="233.333" fill="#000" font-size="13" textLength="78" font-weight="700" font-family="'IBM Plex Sans'">唯一的阻塞点</text><text x="348.016" y="233.333" fill="#000" font-size="13" textLength="26" font-family="'IBM Plex Sans'">——</text><text x="270.016" y="248.644" fill="#000" font-size="13" textLength="130" font-family="'IBM Plex Sans'">上一个住户的两道门闩</text><text x="270.016" y="263.954" fill="#000" font-size="13" textLength="156" font-family="'IBM Plex Sans'">都过了才放行（下一张图）</text><rect x="30.971" y="218.42" width="213.045" height="50.621" fill="#FFE9E9" style="stroke:#C0392B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="40.971" y="240.988" fill="#2B241B" font-size="13" textLength="193.045" font-family="'IBM Plex Sans'">2. 等目标物理 buffer 安全可覆盖</text><text x="40.971" y="256.299" fill="#2B241B" font-size="13" textLength="141.667" font-family="'IBM Plex Sans'">（复用不变式，见 3.3）</text><rect x="21.697" y="335.696" width="231.593" height="35.311" fill="#FFFDF8" style="stroke:#C9B9A2;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="31.697" y="358.265" fill="#2B241B" font-size="13" textLength="211.593" font-family="'IBM Plex Sans'">3. attention 计算 + KV 写入 buffer</text><rect x="16" y="391.007" width="242.987" height="50.621" fill="#FFFDF8" style="stroke:#C9B9A2;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="413.575" fill="#2B241B" font-size="13" textLength="222.987" font-family="'IBM Plex Sans'">4. save_kv_layer：异步 save 到 Host</text><text x="26" y="428.886" fill="#2B241B" font-size="13" textLength="191.852" font-family="'IBM Plex Sans'">+ 发布 RD2H 就绪（见第 2 节）</text><rect x="40.889" y="461.628" width="193.208" height="65.932" fill="#FFFDF8" style="stroke:#C9B9A2;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="50.889" y="484.196" fill="#2B241B" font-size="13" textLength="137.916" font-family="'IBM Plex Sans'">5. prefetch 更后面的层</text><text x="50.889" y="499.507" fill="#2B241B" font-size="13" textLength="173.208" font-family="'IBM Plex Sans'">（layerwise_prefetch_layers</text><text x="50.889" y="514.817" fill="#2B241B" font-size="13" textLength="95.342" font-family="'IBM Plex Sans'">默认 min(B,8)）</text><polygon points="137.493,291.696,149.493,303.696,137.493,315.696,125.493,303.696,137.493,291.696" fill="#FFF6E5" style="stroke:#C9B9A2;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="89.251,552.29,185.736,552.29,197.736,564.29,185.736,576.29,89.251,576.29,77.251,564.29,89.251,552.29" fill="#FFF6E5" style="stroke:#C9B9A2;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="141.493" y="586.925" fill="#000" font-size="11" font-family="'IBM Plex Sans'">无</text><text x="89.251" y="569.203" fill="#2B241B" font-size="13" textLength="96.484" font-family="'IBM Plex Sans'">还有更后面的层?</text><text x="197.736" y="549.015" fill="#000" font-size="11" textLength="91.615" font-family="'IBM Plex Sans'">有：buffer ≥ 2 时</text><text x="197.736" y="561.97" fill="#000" font-size="11" textLength="145.917" font-family="'IBM Plex Sans'">传输与计算重叠，回到第 3 步</text><path d="M193.493,598.425 L193.493,622.391 L173.493,626.391 L193.493,630.391 L193.493,654.356 A0,0 0 0 0 193.493,654.356 L409.493,654.356 A0,0 0 0 0 409.493,654.356 L409.493,608.425 L399.493,598.425 L193.493,598.425 A0,0 0 0 0 193.493,598.425" style="stroke:#C9B9A2;stroke-width:0.5;" fill="#FEFFDD"/><path d="M399.493,598.425 L399.493,608.425 L409.493,608.425 L399.493,598.425" style="stroke:#C9B9A2;stroke-width:0.5;" fill="#FEFFDD"/><text x="199.493" y="615.993" fill="#000" font-size="13" textLength="159.447" font-family="'IBM Plex Sans'">回边画到第 3 步，是为突出</text><text x="199.493" y="631.304" fill="#000" font-size="13" textLength="195" font-family="'IBM Plex Sans'">「预取」与「计算」的重叠窗口；</text><text x="199.493" y="646.614" fill="#000" font-size="13" textLength="159.447" font-family="'IBM Plex Sans'">下一层实际仍从第 1 步开始</text><rect x="101.493" y="608.735" width="72" height="35.311" fill="#FFFDF8" style="stroke:#C9B9A2;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="111.493" y="631.304" fill="#2B241B" font-size="13" textLength="52" font-family="'IBM Plex Sans'">该层结束</text><ellipse cx="137.493" cy