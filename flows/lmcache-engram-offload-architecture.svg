<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 z" fill="#334155"/></marker>
    <style>
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.sub{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.head{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.label{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}.tiny{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.box{stroke:#64748b;stroke-width:1.5;rx:12}.arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="920" fill="#f8fafc"/>
  <text x="750" y="46" text-anchor="middle" class="title">LMCache / LMCache-Ascend Engram 卸载：从 HBM 到 Host 直读</text>
  <text x="750" y="74" text-anchor="middle" class="sub">先解决 HBM 压力，再用 shared full table 消除 Engram 专属 TP all-gather</text>
  <rect x="520" y="100" width="460" height="62" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="750" y="127" text-anchor="middle" class="label">DeepSeek V4.1 checkpoint</text><text x="750" y="150" text-anchor="middle" class="small">Engram FP8/INT8 rows + scale tables</text>

  <rect x="35" y="205" width="430" height="570" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="250" y="242" text-anchor="middle" class="head">当前：HBM 表（baseline）</text><text x="250" y="268" text-anchor="middle" class="small">每个 TP rank 持有设备内 shard</text>
  <rect x="75" y="320" width="150" height="105" class="box" fill="#fee2e2" stroke="#dc2626"/><rect x="295" y="320" width="150" height="105" class="box" fill="#fee2e2" stroke="#dc2626"/>
  <text x="150" y="350" text-anchor="middle" class="label">NPU / HBM</text><text x="150" y="375" text-anchor="middle" class="small">TP rank 0</text><text x="150" y="400" text-anchor="middle" class="tiny">Engram shard</text>
  <text x="370" y="350" text-anchor="middle" class="label">NPU / HBM</text><text x="370" y="375" text-anchor="middle" class="small">TP rank 1</text><text x="370" y="400" text-anchor="middle" class="tiny">Engram shard</text>
  <path d="M225 372 L295 372" class="arrow"/><text x="260" y="355" text-anchor="middle" class="tiny">row lookup</text><path d="M150 455 L150 535" class="arrow"/><path d="M370 455 L370 535" class="arrow"/>
  <rect x="110" y="535" width="280" height="74" class="box" fill="#fef3c7" stroke="#d97706"/><text x="250" y="565" text-anchor="middle" class="label">Engram TP all-gather</text><text x="250" y="589" text-anchor="middle" class="small">完整 heads → decoder</text>
  <text x="250" y="690" text-anchor="middle" class="label">优点：路径简单</text><text x="250" y="716" text-anchor="middle" class="small">缺点：HBM 占用最大</text>

  <rect x="535" y="205" width="430" height="570" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="750" y="242" text-anchor="middle" class="head">阶段 1：rank-local Host shard</text><text x="750" y="268" text-anchor="middle" class="small">推荐第一版：保留 TP all-gather</text>
  <rect x="575" y="310" width="350" height="70" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="750" y="339" text-anchor="middle" class="label">Host pinned / NUMA shard</text><text x="750" y="363" text-anchor="middle" class="small">2 MiB HugeTLB 仅在 capability 通过时启用</text><path d="M750 380 L750 430" class="arrow"/>
  <rect x="575" y="430" width="350" height="78" class="box" fill="#e0e7ff" stroke="#4f46e5"/><text x="750" y="460" text-anchor="middle" class="label">aclrtHostRegister / HAL + mlock</text><text x="750" y="485" text-anchor="middle" class="small">Host VA → NPU device VA</text><path d="M750 508 L750 556" class="arrow"/>
  <rect x="575" y="556" width="350" height="78" class="box" fill="#dbeafe" stroke="#0284c7"/><text x="750" y="586" text-anchor="middle" class="label">NPU Engram lookup/dequant</text><text x="750" y="611" text-anchor="middle" class="small">随机 row read → device staging</text><path d="M750 634 L750 680" class="arrow"/>
  <rect x="625" y="680" width="250" height="58" class="box" fill="#fef3c7" stroke="#d97706"/><text x="750" y="705" text-anchor="middle" class="label">TP all-gather 仍保留</text><text x="750" y="725" text-anchor="middle" class="tiny">先换 HBM，后优化通信</text>

  <rect x="1035" y="205" width="430" height="570" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1250" y="242" text-anchor="middle" class="head">阶段 2：shared full Host table</text><text x="1250" y="268" text-anchor="middle" class="small">同一物理 backing，多进程/多 NPU import</text>
  <rect x="1080" y="315" width="340" height="78" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="1250" y="345" text-anchor="middle" class="label">shared full table</text><text x="1250" y="370" text-anchor="middle" class="small">memfd / hugetlbfs / driver handle</text>
  <path d="M1140 393 L1140 455" class="arrow"/><path d="M1250 393 L1250 455" class="arrow"/><path d="M1360 393 L1360 455" class="arrow"/>
  <rect x="1070" y="455" width="105" height="72" class="box" fill="#e0e7ff" stroke="#4f46e5"/><rect x="1198" y="455" width="105" height="72" class="box" fill="#e0e7ff" stroke="#4f46e5"/><rect x="1326" y="455" width="105" height="72" class="box" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="1122" y="484" text-anchor="middle" class="label">NPU 0</text><text x="1122" y="507" text-anchor="middle" class="tiny">device VA</text><text x="1250" y="484" text-anchor="middle" class="label">NPU 1</text><text x="1250" y="507" text-anchor="middle" class="tiny">device VA</text><text x="1378" y="484" text-anchor="middle" class="label">NPU n</text><text x="1378" y="507" text-anchor="middle" class="tiny">device VA</text>
  <path d="M1250 527 L1250 585" class="arrow"/><rect x="1090" y="585" width="320" height="78" class="box" fill="#dbeafe" stroke="#0284c7"/><text x="1250" y="615" text-anchor="middle" class="label">NPU 直接读取完整 heads/rows</text><text x="1250" y="640" text-anchor="middle" class="small">lookup/dequant 输出完整 Engram rows</text><path d="M1250 663 L1250 705" class="arrow"/>
  <rect x="1125" y="705" width="250" height="45" class="box" fill="#bbf7d0" stroke="#16a34a"/><text x="1250" y="734" text-anchor="middle" class="label">Engram TP all-gather 去掉</text>

  <rect x="70" y="820" width="1360" height="66" rx="12" fill="#e2e8f0" stroke="#94a3b8"/><text x="95" y="847" class="label">必须单独验证：</text><text x="250" y="847" class="small">Host HugeTLB ≠ NPU 一定使用大页 TLB；</text><text x="640" y="847" class="small">aclrtHostRegister ≠ 已证明高效随机读；</text><text x="1010" y="847" class="small">shared full 只消除 Engram 专属 collective。</text><text x="95" y="872" class="tiny">若 direct random read / shared import 未通过 capability probe，回退到 row staging 或 HBM 表。</text>
</svg>
