<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <style>
      .bg { fill: #f7f8fc; }
      .title { font: 700 34px Inter, "Noto Sans SC", sans-serif; fill: #172033; }
      .subtitle { font: 400 17px Inter, "Noto Sans SC", sans-serif; fill: #59657a; }
      .section { font: 700 23px Inter, "Noto Sans SC", sans-serif; fill: #172033; }
      .label { font: 650 17px Inter, "Noto Sans SC", sans-serif; fill: #172033; }
      .body { font: 400 15px Inter, "Noto Sans SC", sans-serif; fill: #344054; }
      .small { font: 400 13px Inter, "Noto Sans SC", sans-serif; fill: #59657a; }
      .code { font: 500 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #344054; }
      .card { fill: #ffffff; stroke: #d8deea; stroke-width: 1.5; rx: 18; }
      .blue { fill: #eaf2ff; stroke: #8db4f8; stroke-width: 1.5; rx: 12; }
      .green { fill: #e9f8f1; stroke: #74c69d; stroke-width: 1.5; rx: 12; }
      .amber { fill: #fff6df; stroke: #e8b44f; stroke-width: 1.5; rx: 12; }
      .red { fill: #fff0f0; stroke: #e28787; stroke-width: 1.5; rx: 12; }
      .purple { fill: #f2edff; stroke: #aa91e8; stroke-width: 1.5; rx: 12; }
      .arrow { fill: none; stroke: #65748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-green { fill: none; stroke: #2f8f66; stroke-width: 2.6; marker-end: url(#arrowGreen); }
      .dash { fill: none; stroke: #c18320; stroke-width: 2.2; stroke-dasharray: 8 7; marker-end: url(#arrowAmber); }
      .divider { stroke: #d8deea; stroke-width: 1.5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#65748b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f8f66"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c18320"/>
    </marker>
  </defs>

  <rect class="bg" width="1500" height="900"/>
  <text class="title" x="750" y="52" text-anchor="middle">Mooncake 中实现 Engram Offload：当前路径、推荐路径、未来路径</text>
  <text class="subtitle" x="750" y="82" text-anchor="middle">源码基线 e389a850 · “row materialization” 不等于 “NPU 直接随机读完整 Host table”</text>

  <rect class="card" x="36" y="112" width="440" height="656"/>
  <text class="section" x="256" y="150" text-anchor="middle">当前 EngramStore</text>
  <text class="small" x="256" y="175" text-anchor="middle">已实装 · storage-side ranged lookup</text>

  <rect class="blue" x="74" y="205" width="364" height="92"/>
  <text class="label" x="256" y="232" text-anchor="middle">每 layer/head 一个 Store object</text>
  <text class="code" x="256" y="257" text-anchor="middle">engram:l{layer}:h{head}</text>
  <text class="body" x="256" y="281" text-anchor="middle">float32 [N_h, D] · 无 model/revision</text>

  <path class="arrow" d="M256 297 L256 332"/>
  <rect class="purple" x="74" y="333" width="364" height="108"/>
  <text class="label" x="256" y="361" text-anchor="middle">每次 lookup</text>
  <text class="body" x="256" y="386" text-anchor="middle">row ids → batch_query → query cache</text>
  <text class="body" x="256" y="410" text-anchor="middle">get_into_ranges / SubmitScatter</text>
  <text class="small" x="256" y="430" text-anchor="middle">选中 rows 被物化到 output</text>

  <path class="arrow" d="M256 441 L256 476"/>
  <rect class="red" x="74" y="477" width="364" height="105"/>
  <text class="label" x="256" y="505" text-anchor="middle">Python 当前输出</text>
  <text class="code" x="256" y="531" text-anchor="middle">NumPy float32 [B,L,H,D]</text>
  <text class="body" x="256" y="557" text-anchor="middle">不是 torch NPU tensor</text>

  <rect class="amber" x="74" y="614" width="364" height="116"/>
  <text class="label" x="256" y="642" text-anchor="middle">热路径缺口</text>
  <text class="body" x="96" y="668">• FP8/INT8 + scale layout</text>
  <text class="body" x="96" y="692">• 长生命周期 device output 注册</text>
  <text class="body" x="96" y="716">• stable full-table device view</text>

  <rect class="card" x="530" y="112" width="440" height="656"/>
  <text class="section" x="750" y="150" text-anchor="middle">推荐 M1：Backing + 本地物化</text>
  <text class="small" x="750" y="175" text-anchor="middle">默认生产方案 · Mooncake 不进入每 token 热路径</text>

  <rect class="blue" x="568" y="205" width="364" height="86"/>
  <text class="label" x="750" y="232" text-anchor="middle">Mooncake distributed backing</text>
  <text class="body" x="750" y="258" text-anchor="middle">manifest · weight/scale · replicas</text>
  <text class="small" x="750" y="279" text-anchor="middle">跨节点存放、分发、恢复</text>

  <path class="arrow-green" d="M750 291 L750 326"/>
  <text class="small" x="765" y="315">model load / warmup</text>
  <rect class="green" x="568" y="327" width="364" height="111"/>
  <text class="label" x="750" y="355" text-anchor="middle">node-local immutable asset</text>
  <text class="body" x="750" y="381" text-anchor="middle">shared HugeTLB / A3 Fabric backing</text>
  <text class="body" x="750" y="406" text-anchor="middle">NUMA bind · checksum · sealed · no-evict</text>
  <text class="small" x="750" y="427" text-anchor="middle">LMCache 或独立 asset manager 管生命周期</text>

  <path class="arrow-green" d="M750 438 L750 473"/>
  <rect class="green" x="568" y="474" width="364" height="105"/>
  <text class="label" x="750" y="503" text-anchor="middle">每 worker / NPU import</text>
  <text class="body" x="750" y="529" text-anchor="middle">Host VA → device VA</text>
  <text class="body" x="750" y="554" text-anchor="middle">NPU fused gather + dequant</text>

  <path class="arrow-green" d="M750 579 L750 614"/>
  <rect class="green" x="568" y="615" width="364" height="115"/>
  <text class="label" x="750" y="643" text-anchor="middle">Collective 结果</text>
  <text class="body" x="590" y="670">rank-local shard → 保留 Engram all-gather</text>
  <text class="body" x="590" y="696">shared full table → 可去掉 Engram gather</text>
  <text class="small" x="750" y="718" text-anchor="middle">不影响模型其他 TP / EP collective</text>

  <rect class="card" x="1024" y="112" width="440" height="656"/>
  <text class="section" x="1244" y="150" text-anchor="middle">未来 M3：Mooncake Direct-Map</text>
  <text class="small" x="1244" y="175" text-anchor="middle">架构推演 · 现有 primitive 可复用，契约尚未补齐</text>

  <rect class="purple" x="1062" y="205" width="364" height="96"/>
  <text class="label" x="1244" y="233" text-anchor="middle">已有基础</text>
  <text class="body" x="1084" y="260">• memfd HugeTLB：2M / 512M / 1G</text>
  <text class="body" x="1084" y="284">• A3 Fabric handle export / import</text>

  <path class="arrow" d="M1244 301 L1244 336"/>
  <rect class="amber" x="1062" y="337" width="364" height="166"/>
  <text class="label" x="1244" y="365" text-anchor="middle">必须新增 immutable asset 契约</text>
  <text class="body" x="1084" y="393">1. pin / no-evict / no-relocation</text>
  <text class="body" x="1084" y="419">2. stable handle + object offset</text>
  <text class="body" x="1084" y="445">3. generation / checksum / lease</text>
  <text class="body" x="1084" y="471">4. multi-process / multi-NPU import</text>
  <text class="body" x="1084" y="497">5. stream-safe unmap / release</text>

  <path class="arrow" d="M1244 503 L1244 538"/>
  <rect class="green" x="1062" y="539" width="364" height="101"/>
  <text class="label" x="1244" y="568" text-anchor="middle">目标热路径</text>
  <text class="body" x="1244" y="595" text-anchor="middle">hash ids → stable device view</text>
  <text class="body" x="1244" y="620" text-anchor="middle">NPU 对完整共享表随机读</text>

  <rect class="red" x="1062" y="665" width="364" height="65"/>
  <text class="label" x="1244" y="692" text-anchor="middle">当前不能声称已实现</text>
  <text class="small" x="1244" y="716" text-anchor="middle">Store zero-copy ≠ kernel direct table load</text>

  <path class="dash" d="M476 520 C505 520 505 520 530 520"/>
  <text class="small" x="503" y="504" text-anchor="middle">M2</text>
  <text class="small" x="503" y="544" text-anchor="middle">row service</text>

  <line class="divider" x1="36" y1="803" x2="1464" y2="803"/>
  <rect class="blue" x="92" y="824" width="1316" height="48"/>
  <text class="label" x="750" y="854" text-anchor="middle">一句话：Mooncake 管“表从哪里来”，节点 asset manager 管“表如何常驻共享”，Ascend backend 管“NPU 怎么读”</text>
</svg>
