<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" class="diagram" role="img"
     aria-label="每个 Decode Step 的 7 个编号步骤：新 K/V 直接 D2H 落 host pool，indexer 选逻辑 top-k，LRU 驻留判定，仅 miss 行 H2D，重映射后在热 buffer 上跑 sparse attention">
  <defs>
    <marker id="dskAR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="var(--line-2)"/>
    </marker>
  </defs>

  <text x="20" y="26" class="t-band" fill="var(--l4)">DECODE STEP · 7 步，NPU 与 Host 的分工</text>

  <rect x="20" y="44" width="1160" height="732" rx="10" fill="var(--l3)" fill-opacity=".05" stroke="var(--line)"/>
  <text x="44" y="74" class="t-title-sm">每个 Decode Step</text>
  <text x="200" y="74" class="t-sub">D 侧 SparseKVOffloadManager：offload_new_kv:1077 / onload_topk_kv:1215</text>
  <rect x="900" y="62" width="10" height="10" rx="2" fill="var(--l2)" fill-opacity=".35" stroke="var(--l2)"/>
  <text x="916" y="72" class="t-mono">NPU 侧</text>
  <rect x="1010" y="62" width="10" height="10" rx="2" fill="var(--l4)" fill-opacity=".35" stroke="var(--l4)"/>
  <text x="1026" y="72" class="t-mono">落 Host / 从 Host 取</text>

  <!-- ① -->
  <rect x="44" y="117" width="104" height="30" rx="6" fill="var(--wash)" stroke="var(--line)"/>
  <text x="96" y="137" class="t-mono" text-anchor="middle">NPU</text>
  <rect x="168" y="96" width="988" height="72" rx="7" fill="var(--panel)" stroke="var(--line)"/>
  <text x="188" y="124" class="t-title-sm">① pre-attn：qkv_proj / norm / rope</text>
  <text x="188" y="148" class="t-mono">算出新 token 的 K/V；此时它只存在于 NPU 上，还没有任何 main cache 接住它</text>
  <line x1="662" y1="168" x2="662" y2="190" class="t-line" marker-end="url(#dskAR)"/>

  <!-- ② -->
  <rect x="44" y="215" width="104" height="30" rx="6" fill="var(--l4)" fill-opacity=".12" stroke="var(--l4)"/>
  <text x="96" y="235" class="t-mono" text-anchor="middle">NPU→Host</text>
  <rect x="168" y="194" width="988" height="72" rx="7" fill="var(--wash)" stroke="var(--line)"/>
  <text x="188" y="222" class="t-title-sm">② 新 K/V 不写 NPU 分页 main cache，直接 D2H 到 host pool</text>
  <text x="188" y="246" class="t-mono">写到 ③ host pool 的逻辑槽位；TP rank0 写共享 pool，GVA 广播给全 TP</text>
  <line x1="662" y1="266" x2="662" y2="288" class="t-line" marker-end="url(#dskAR)"/>

  <!-- ③ -->
  <rect x="44" y="313" width="104" height="30" rx="6" fill="var(--wash)" stroke="var(--line)"/>
  <text x="96" y="333" class="t-mono" text-anchor="middle">NPU</text>
  <rect x="168" y="292" width="988" height="72" rx="7" fill="var(--panel)" stroke="var(--line)"/>
  <text x="188" y="320" class="t-title-sm">③ indexer 选出逻辑 top-k token 位置</text>
  <text x="188" y="344" class="t-mono">indexer cache 常驻 NPU（完整、rank-local）；这一步只给位置，KV 仍在 host</text>
  <line x1="662" y1="364" x2="662" y2="386" class="t-line" marker-end="url(#dskAR)"/>

  <!-- ④ -->
  <rect x="44" y="411" width="104" height="30" rx="6" fill="var(--wash)" stroke="var(--line)"/>
  <text x="96" y="431" class="t-mono" text-anchor="middle">NPU</text>
  <rect x="168" y="390" width="988" height="72" rx="7" fill="var(--panel)" stroke="var(--line)"/>
  <text x="188" y="418" class="t-title-sm">④ LRU 驻留表判定：hit / miss / 淘汰</text>
  <text x="188" y="442" class="t-mono">hit → 已在热 buffer；miss → 分配物理热槽；热 buffer 满 → 按 LRU 选一个淘汰槽</text>
  <line x1="662" y1="462" x2="662" y2="484" class="t-line" marker-end="url(#dskAR)"/>

  <!-- ⑤ -->
  <rect x="44" y="509" width="104" height="30" rx="6" fill="var(--l4)" fill-opacity=".12" stroke="var(--l4)"/>
  <text x="96" y="529" class="t-mono" text-anchor="middle">Host→NPU</text>
  <rect x="168" y="488" width="988" height="72" rx="7" fill="var(--wash)" stroke="var(--line)"/>
  <text x="188" y="516" class="t-title-sm">⑤ 仅 miss 行从 host H2D 拷入热 buffer</text>
  <text x="188" y="540" class="t-mono">搬运量正比于 miss 数，而不是序列长度——这是 sparse 省带宽的全部来源</text>
  <line x1="662" y1="560" x2="662" y2="582" class="t-line" marker-end="url(#dskAR)"/>

  <!-- ⑥ -->
  <rect x="44" y="607" width="104" height="30" rx="6" fill="var(--wash)" stroke="var(--line)"/>
  <text x="96" y="627" class="t-mono" text-anchor="middle">NPU</text>
  <rect x="168" y="586" width="988" height="72" rx="7" fill="var(--panel)" stroke="var(--line)"/>
  <text x="188" y="614" class="t-title-sm">⑥ 逻辑 top-k 位置 → 物理热槽位重映射</text>
  <text x="188" y="638" class="t-mono">把 indexer 给的逻辑位置翻译成热 buffer 里的物理槽，attention 只认物理槽</text>
  <line x1="662" y1="658" x2="662" y2="680" class="t-line" marker-end="url(#dskAR)"/>

  <!-- ⑦ -->
  <rect x="44" y="705" width="104" height="30" rx="6" fill="var(--wash)" stroke="var(--line)"/>
  <text x="96" y="725" class="t-mono" text-anchor="middle">NPU</text>
  <rect x="168" y="684" width="988" height="72" rx="7" fill="var(--l2)" fill-opacity=".07" stroke="var(--l2)"/>
  <text x="188" y="712" class="t-title-sm">⑦ 在热 buffer 上跑 sparse attention</text>
  <text x="188" y="736" class="t-mono">驻留元数据留给下一步复用；热 buffer 开 2×topk 时命中率 80%–90%</text>

  <line x1="44" y1="796" x2="1156" y2="796" stroke="var(--line)"/>
  <text x="44" y="820" class="t-mono">7 步里只有 ② 让数据落 Host、⑤ 把它按行搬回；其余 5 步都在 NPU 内完成。</text>
  <text x="44" y="844" class="t-mono">① 的 K/V 产生在 NPU，② 直接把它推给 host：decode 路径根本没有 NPU 分页 main cache。</text>
  <text x="44" y="868" class="t-mono" fill="var(--muted)">RFC #33980 说先写常规块再整块 offload，main 更激进；③④⑥⑦ 的元数据（indexer、驻留表、重映射）都在 device 侧。</text>
</svg>
