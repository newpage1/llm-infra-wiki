<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 970" class="diagram" role="img"
     aria-label="端到端生命周期：请求到 Proxy 后在 D 侧 rendezvous，转发给 P 逐层 prefill，每层 save 并等 D 拉取，门闩判定后有层则回到逐层 prefill、全部终态后 D 可调度，再进入每 step 的 7 步，继续生成则自环">
  <defs>
    <marker id="e2eAR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="var(--line-2)"/>
    </marker>
    <marker id="e2eARa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="var(--l2)"/>
    </marker>
    <marker id="e2eARb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="var(--l4)"/>
    </marker>
  </defs>

  <text x="20" y="26" class="t-band" fill="var(--l1)">端到端 · 从请求到结束的完整生命周期</text>
  <text x="44" y="54" class="t-sub">P 只暴露、D 主动拉；两道门闩把「逐层 prefill」和「D 每 step」串起来</text>

  <!-- 阶段带 -->
  <rect x="44" y="344" width="88" height="272" rx="8" fill="var(--l1)" fill-opacity=".07" stroke="var(--l1)"/>
  <text x="88" y="382" class="t-band" fill="var(--l1)" text-anchor="middle">P 阶段</text>
  <text x="88" y="404" class="t-mono-c" text-anchor="middle">①</text>
  <text x="88" y="592" class="t-mono" text-anchor="middle" fill="var(--muted)">prefill</text>
  <rect x="44" y="620" width="88" height="268" rx="8" fill="var(--l4)" fill-opacity=".07" stroke="var(--l4)"/>
  <text x="88" y="658" class="t-band" fill="var(--l4)" text-anchor="middle">D 阶段</text>
  <text x="88" y="680" class="t-mono-c" text-anchor="middle">②</text>
  <text x="88" y="856" class="t-mono" text-anchor="middle" fill="var(--muted)">decode</text>

  <!-- 1 -->
  <rect x="160" y="80" width="680" height="64" rx="7" fill="var(--panel)" stroke="var(--line)"/>
  <text x="180" y="106" class="t-title-sm">请求到达 Proxy</text>
  <text x="180" y="128" class="t-mono">客户端请求进 load_balance_proxy_layerwise_server，由 Proxy 决定配哪对 P 与 D</text>
  <line x1="500" y1="144" x2="500" y2="170" class="t-line" marker-end="url(#e2eAR)"/>

  <!-- 2 -->
  <rect x="160" y="172" width="680" height="64" rx="7" fill="var(--panel)" stroke="var(--line)"/>
  <text x="180" y="198" class="t-title-sm">D: rendezvous</text>
  <text x="180" y="220" class="t-mono">分配 ③ host 池 + ④ indexer 块；广播 endpoint / TP 拓扑 / remote_cached_tokens</text>
  <line x1="500" y1="236" x2="500" y2="262" class="t-line" marker-end="url(#e2eAR)"/>

  <!-- 3 -->
  <rect x="160" y="264" width="680" height="64" rx="7" fill="var(--panel)" stroke="var(--line)"/>
  <text x="180" y="290" class="t-title-sm">Proxy 转发给 P</text>
  <text x="180" y="312" class="t-mono">P 记录 source block id、D endpoint 与已传 token 数；D 的 block id 不出 D 节点</text>
  <line x1="500" y1="328" x2="500" y2="354" class="t-line" marker-end="url(#e2eAR)"/>

  <!-- 4 -->
  <rect x="160" y="356" width="680" height="64" rx="7" fill="var(--panel)" stroke="var(--line)"/>
  <text x="180" y="382" class="t-title-sm">P: layerwise prefill</text>
  <text x="180" y="404" class="t-mono">I + min(B, R) 个物理 buffer 逐层算；第 i 层与第 i+B 层共用同一块 buffer</text>
  <line x1="500" y1="420" x2="500" y2="446" class="t-line" marker-end="url(#e2eAR)"/>

  <!-- 5 -->
  <rect x="160" y="448" width="680" height="64" rx="7" fill="var(--panel)" stroke="var(--line)"/>
  <text x="180" y="474" class="t-title-sm">每层：AscendStore save ① + RD2H 拉取</text>
  <text x="180" y="496" class="t-mono">READ_READY_BATCH(layer_idx, 块 id, 偏移) → D 侧 MemFabric 批量读 → READ_DONE(i)</text>
  <line x1="500" y1="512" x2="500" y2="538" class="t-line" marker-end="url(#e2eAR)"/>

  <!-- 6 门闩 -->
  <rect x="160" y="540" width="680" height="64" rx="7" fill="var(--l1)" fill-opacity=".07" stroke="var(--l1)" stroke-width="2"/>
  <text x="180" y="566" class="t-title-sm">门闩：save 完成 ∧ 全 contributor 读完 → 复用</text>
  <text x="180" y="588" class="t-mono">AscendMultiConnector 双门组合，按物理 storage slot 跟踪；main-KV 与 indexer 各一道</text>

  <!-- 6 → 4 回边（还有层） -->
  <path d="M840,572 L1020,572 L1020,388 L846,388" fill="none" stroke="var(--l2)" marker-end="url(#e2eARa)"/>
  <text x="1032" y="470" class="t-mono" fill="var(--l2)">还有层</text>
  <text x="1032" y="490" class="t-mono">回到逐层 prefill</text>

  <!-- 6 → 7 全部层终态 -->
  <line x1="500" y1="604" x2="500" y2="630" class="t-line" marker-end="url(#e2eAR)"/>
  <text x="512" y="624" class="t-mono" fill="var(--l1)">全部层终态</text>

  <!-- 7 -->
  <rect x="160" y="632" width="680" height="64" rx="7" fill="var(--panel)" stroke="var(--line)"/>
  <text x="180" y="658" class="t-title-sm">D: 请求可调度</text>
  <text x="180" y="680" class="t-mono">全部层 + 所有 rank 到终态才算请求完成；物理 buffer 完成 ≠ 请求完成</text>
  <line x1="500" y1="696" x2="500" y2="722" class="t-line" marker-end="url(#e2eAR)"/>

  <!-- 8 decode -->
  <rect x="160" y="724" width="680" height="64" rx="7" fill="var(--l4)" fill-opacity=".07" stroke="var(--l4)" stroke-width="2"/>
  <text x="180" y="750" class="t-title-sm">D: 每 step ①~⑦</text>
  <text x="180" y="772" class="t-mono">新 K/V 直接 D2H / indexer 选逻辑 top-k / LRU 判定 / 仅 miss 行 H2D / sparse attn</text>

  <!-- 8 自环（继续生成） -->
  <path d="M840,770 L1140,770 L1140,738 L846,738" fill="none" stroke="var(--l4)" marker-end="url(#e2eARb)"/>
  <text x="980" y="752" class="t-mono" fill="var(--l4)">继续生成</text>
  <text x="980" y="768" class="t-mono">下一 step 重走 ①~⑦</text>

  <!-- P 退场注记 -->
  <rect x="880" y="620" width="300" height="84" rx="8" fill="var(--wash)" stroke="var(--line)"/>
  <text x="896" y="648" class="t-title-sm">P 在此退场</text>
  <text x="896" y="672" class="t-mono">prefill 之后 P 不再参与；</text>
  <text x="896" y="692" class="t-mono">decode 全程在 D 节点内部</text>

  <!-- 9 -->
  <line x1="500" y1="788" x2="500" y2="814" class="t-line" marker-end="url(#e2eAR)"/>
  <rect x="160" y="816" width="680" height="64" rx="7" fill="var(--panel)" stroke="var(--line)"/>
  <text x="180" y="842" class="t-title-sm">结束</text>
  <text x="180" y="864" class="t-mono">采样结束；KV 留在 host 池，成为下一轮的 CPU 前缀缓存</text>

  <line x1="160" y1="908" x2="1156" y2="908" stroke="var(--line)"/>
  <text x="160" y="932" class="t-mono">P 阶段只有 prefill 窗口；D 阶段从「请求可调度」开始，每 step 循环直到结束。</text>
  <text x="160" y="956" class="t-mono" fill="var(--muted)">两道门闩、两个环：门闩的「还有层」回边是层循环（P 内存复用），decode 的自环是 step 循环（D 生成）。</text>
</svg>
