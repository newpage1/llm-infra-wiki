<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" class="diagram" role="img"
     aria-label="vLLM-Ascend 全景：Prefill 与 Decode 两个节点各自有 Host 与 NPU 两个存储区域，共四个区域；五条带标注的传输边（内容 / 粒度 / 方式）串起它们，①↔② 为双向">
  <defs>
    <marker id="fsr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="var(--line-2)"/>
    </marker>
    <marker id="fss" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M9,1 L0,5 L9,9 z" fill="var(--line-2)"/>
    </marker>
  </defs>

  <text x="20" y="26" class="t-band" fill="var(--l1)">全景 · 四个存储区域 + 五条传输边</text>
  <text x="1180" y="26" class="t-mono" text-anchor="end" style="fill:var(--muted)"><tspan font-weight="600">[源码]</tspan> 设计文档 §2；main 实现与此一致（RFC 图的 device memory 即 NPU HBM）</text>

  <!-- P 节点 -->
  <rect x="20" y="48" width="500" height="562" rx="10" fill="var(--l1)" fill-opacity=".05" stroke="var(--line)"/>
  <rect x="20" y="48" width="3" height="562" fill="var(--l1)"/>
  <text x="44" y="78" class="t-band" fill="var(--l1)">PREFILL 节点 · P</text>
  <text x="44" y="100" class="t-sub">AscendStoreConnector 管 ①↔②；② 是 P 唯一对外暴露的东西</text>

  <!-- D 节点 -->
  <rect x="680" y="48" width="500" height="562" rx="10" fill="var(--l4)" fill-opacity=".05" stroke="var(--line)"/>
  <rect x="680" y="48" width="3" height="562" fill="var(--l4)"/>
  <text x="704" y="78" class="t-band" fill="var(--l4)">DECODE 节点 · D</text>
  <text x="704" y="100" class="t-sub">SparseKVOffloadManager 拥有 ③ 与 ④</text>

  <!-- ① Prefill Host -->
  <rect x="44" y="120" width="452" height="110" rx="7" fill="var(--panel)" stroke="var(--line)"/>
  <text x="60" y="146" class="t-title-sm">① Prefill Host KV pool</text>
  <text x="60" y="168" class="t-mono" style="fill:var(--muted)">Memcache 后端 · 完整 KV</text>
  <text x="60" y="186" class="t-mono" style="fill:var(--muted)">按层换入换出（整层粒度）</text>
  <text x="60" y="204" class="t-mono" style="fill:var(--muted)">KV 一个字节没少，只是搬到了 host DRAM</text>

  <!-- ② Prefill NPU -->
  <rect x="44" y="456" width="452" height="130" rx="7" fill="var(--panel)" stroke="var(--line)"/>
  <text x="60" y="482" class="t-title-sm">② Prefill NPU · 整层物理 buffer</text>
  <text x="60" y="504" class="t-mono" style="fill:var(--muted)">少量可复用的整层 buffer</text>
  <text x="60" y="522" class="t-mono" style="fill:var(--muted)">物理 buffer 数 = I + min(B, R)</text>
  <text x="60" y="540" class="t-mono" style="fill:var(--muted)">I = 独享层数（默认 [0]），R = N − I</text>
  <text x="60" y="558" class="t-mono" style="fill:var(--muted)">这是 P 在 P/D 之间唯一暴露的东西</text>
  <text x="60" y="576" class="t-mono" style="fill:var(--muted)">main-KV HBM 占比 ≈ buffer 数 / N</text>

  <!-- ③ Decode Host -->
  <rect x="704" y="120" width="452" height="110" rx="7" fill="var(--panel)" stroke="var(--line)"/>
  <text x="720" y="146" class="t-title-sm">③ Decode Host · pinned pool</text>
  <text x="720" y="168" class="t-mono" style="fill:var(--muted)">完整 main KV，权威副本（authoritative）</text>
  <text x="720" y="186" class="t-mono" style="fill:var(--muted)">由 SparseKVOffloadManager 拥有</text>
  <text x="720" y="204" class="t-mono" style="fill:var(--muted)">TP 共享；只有 rank 0 真正 malloc</text>

  <!-- ④ Decode NPU -->
  <rect x="704" y="456" width="452" height="130" rx="7" fill="var(--panel)" stroke="var(--line)"/>
  <text x="720" y="482" class="t-title-sm">④ Decode NPU</text>
  <text x="720" y="504" class="t-mono" style="fill:var(--muted)">indexer cache（完整，rank-local）</text>
  <text x="720" y="522" class="t-mono" style="fill:var(--muted)">每层 top-k 热 buffer（LRU 可淘汰）</text>
  <text x="720" y="540" class="t-mono" style="fill:var(--muted)">可选 LIC8 scale 跟随 indexer</text>
  <text x="720" y="558" class="t-mono" style="fill:var(--muted)">decode 路径上没有 NPU main KV 分页 cache</text>
  <text x="720" y="576" class="t-mono" style="fill:var(--muted)">热 buffer 满时按 LRU 选淘汰槽</text>

  <!-- ①↔② 双向 -->
  <line x1="110" y1="230" x2="110" y2="456" class="t-line" marker-start="url(#fss)" marker-end="url(#fsr)"/>
  <text x="132" y="316" class="t-mono" style="fill:var(--ink-2)">完整 KV，按层换入换出</text>
  <text x="132" y="334" class="t-mono" style="fill:var(--ink-2)">粒度：整层</text>
  <text x="132" y="352" class="t-mono" style="fill:var(--ink-2)">AscendStore save/load（Memcache）</text>

  <!-- ② → ③ -->
  <path d="M496,500 L536,500 L536,180 L698,180" class="t-line" fill="none" marker-end="url(#fsr)"/>
  <text x="548" y="290" class="t-mono" style="fill:var(--ink-2)">main KV（整层）</text>
  <text x="548" y="308" class="t-mono" style="fill:var(--ink-2)">粒度：层 / 块范围</text>
  <text x="548" y="326" class="t-mono" style="fill:var(--ink-2)">MemFabric 远程 D2H 拉取</text>

  <!-- ② → ④ -->
  <line x1="496" y1="550" x2="698" y2="550" class="t-line" marker-end="url(#fsr)"/>
  <text x="612" y="508" class="t-mono" text-anchor="middle" style="fill:var(--ink-2)">indexer / LIC8 scale</text>
  <text x="612" y="526" class="t-mono" text-anchor="middle" style="fill:var(--ink-2)">粒度：块范围</text>
  <text x="612" y="544" class="t-mono" text-anchor="middle" style="fill:var(--ink-2)">Remote pull</text>

  <!-- ④ → ③ 与 ③ → ④ -->
  <line x1="780" y1="456" x2="780" y2="230" class="t-line" marker-end="url(#fsr)"/>
  <line x1="820" y1="230" x2="820" y2="456" class="t-line" marker-end="url(#fsr)"/>
  <text x="840" y="296" class="t-mono" style="fill:var(--ink-2)">新 token K/V</text>
  <text x="840" y="314" class="t-mono" style="fill:var(--ink-2)">粒度：token 行</text>
  <text x="840" y="332" class="t-mono" style="fill:var(--ink-2)">D2H 写回 ③</text>
  <text x="840" y="366" class="t-mono" style="fill:var(--ink-2)">top-k miss</text>
  <text x="840" y="384" class="t-mono" style="fill:var(--ink-2)">粒度：token 行</text>
  <text x="840" y="402" class="t-mono" style="fill:var(--ink-2)">H2D 回迁 ④</text>

  <!-- 底部解读 -->
  <rect x="20" y="636" width="1160" height="170" rx="10" fill="var(--l3)" fill-opacity=".05" stroke="var(--line)"/>
  <rect x="20" y="636" width="3" height="170" fill="var(--l3)"/>
  <text x="44" y="662" class="t-band" fill="var(--l3)">三个组件的分工 · 以及所有权的不对称</text>
  <text x="44" y="690" class="t-mono">AscendStoreConnector（P）：经 Memcache 在 ①↔② 之间按层 save/load —— Layerwise Prefill Offload</text>
  <text x="44" y="710" class="t-mono">SfaRemoteD2HConnector（P+D）：P 暴露 ② 的 buffer 并按层发就绪通知；D 经 MemFabric 把 main KV 拉进 ③、把 indexer 拉进 ④</text>
  <text x="44" y="730" class="t-mono">SparseKVOffloadManager（D）：拥有 ③ 的 host pool 与 ④ 的 top-k 热 buffer，负责 LRU 驻留、miss 判定与回迁</text>
  <text x="44" y="750" class="t-mono">所有权不对称：main K/V 在 P 侧是常规分页 NPU cache，到 D 侧进 TP 共享的 pinned CPU pool</text>
  <text x="44" y="770" class="t-mono">indexer K/V 则是每个 D TP rank 拉一份完整的 rank-local NPU 副本（对 P 不可见）</text>
  <text x="44" y="792" class="t-mono" style="fill:var(--muted)">粒度由「地址何时可知」决定：P→D 每层算完地址已知，可整层 / 块范围发；decode 的 miss 要等 top-k 与驻留查表之后才知道，只能按 token 行拷贝</text>
</svg>
