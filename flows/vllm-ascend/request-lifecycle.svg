<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1797" class="diagram" role="img"
     aria-label="vLLM-Ascend P/D 分离下一次请求的端到端生命周期：客户端→Proxy→D 侧 rendezvous→P 侧逐层 prefill 与逐层传输→D 侧终态判定，共 6 个参与者、17 个编号步骤">
  <defs>
    <marker id="lfa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="var(--line-2)"/>
    </marker>
  </defs>
  <text x="20" y="26" class="t-band" fill="var(--l2)">端到端请求生命周期 · 一次请求从进来到开始 decode</text>
  <text x="400" y="26" class="t-mono" style="fill:var(--muted)">实线 = 消息 ｜ 虚线 = 应答 ｜ 方框 = 泳道内部动作 ｜ 浅色横带 = 原图的 rect 阶段</text>
  <text x="1180" y="26" class="t-mono" text-anchor="end" style="fill:var(--muted)"><tspan font-weight="600">[源码]</tspan> vllm_ascend main 4c5ee332</text>
  <rect x="25" y="52" width="184" height="88" rx="8" fill="var(--panel)" stroke="var(--line)"/>
  <text x="117" y="78" class="t-title-sm" text-anchor="middle">客户端</text>
  <text x="117" y="102" class="t-mono" text-anchor="middle" style="fill:var(--muted)">Cli</text>
  <rect x="218" y="52" width="184" height="88" rx="8" fill="var(--panel)" stroke="var(--line)"/>
  <text x="310" y="78" class="t-title-sm" text-anchor="middle">P/D Proxy</text>
  <text x="310" y="102" class="t-mono" text-anchor="middle" style="fill:var(--muted)">load_balance_proxy_</text>
  <text x="310" y="119" class="t-mono" text-anchor="middle" style="fill:var(--muted)">layerwise_server</text>
  <rect x="411" y="52" width="184" height="88" rx="8" fill="var(--panel)" stroke="var(--line)"/>
  <text x="503" y="78" class="t-title-sm" text-anchor="middle">D Scheduler</text>
  <text x="503" y="102" class="t-mono" text-anchor="middle" style="fill:var(--muted)">SfaRemoteD2HConnector</text>
  <text x="503" y="119" class="t-mono" text-anchor="middle" style="fill:var(--muted)">consumer</text>
  <rect x="605" y="52" width="184" height="88" rx="8" fill="var(--panel)" stroke="var(--line)"/>
  <text x="697" y="78" class="t-title-sm" text-anchor="middle">D Worker</text>
  <text x="697" y="102" class="t-mono" text-anchor="middle" style="fill:var(--muted)">read_thread</text>
  <rect x="798" y="52" width="184" height="88" rx="8" fill="var(--panel)" stroke="var(--line)"/>
  <text x="890" y="78" class="t-title-sm" text-anchor="middle">P Scheduler</text>
  <text x="890" y="102" class="t-mono" text-anchor="middle" style="fill:var(--muted)">SfaRemoteD2HConnector</text>
  <text x="890" y="119" class="t-mono" text-anchor="middle" style="fill:var(--muted)">producer</text>
  <rect x="991" y="52" width="184" height="88" rx="8" fill="var(--panel)" stroke="var(--line)"/>
  <text x="1083" y="78" class="t-title-sm" text-anchor="middle">P Worker</text>
  <text x="1083" y="102" class="t-mono" text-anchor="middle" style="fill:var(--muted)">forward + send_thread</text>
  <line x1="117" y1="140" x2="117" y2="1777" class="t-line" stroke-dasharray="2 5" opacity=".65"/>
  <line x1="310" y1="140" x2="310" y2="1777" class="t-line" stroke-dasharray="2 5" opacity=".65"/>
  <line x1="503" y1="140" x2="503" y2="1777" class="t-line" stroke-dasharray="2 5" opacity=".65"/>
  <line x1="697" y1="140" x2="697" y2="1777" class="t-line" stroke-dasharray="2 5" opacity=".65"/>
  <line x1="890" y1="140" x2="890" y2="1777" class="t-line" stroke-dasharray="2 5" opacity=".65"/>
  <line x1="1083" y1="140" x2="1083" y2="1777" class="t-line" stroke-dasharray="2 5" opacity=".65"/>
  <rect x="20" y="150" width="1160" height="398" rx="10" fill="var(--l4)" fill-opacity=".05" stroke="var(--line)"/>
  <rect x="20" y="150" width="3" height="398" fill="var(--l4)"/>
  <text x="38" y="176" class="t-band" fill="var(--l4)">RENDEZVOUS · 会合阶段（见 2.1）</text>
  <text x="38" y="196" class="t-sub">D 先分好落点、把联系方式广播出去；P 之后才能发就绪通知</text>
  <rect x="20" y="696" width="1160" height="813" rx="10" fill="var(--l4)" fill-opacity=".05" stroke="var(--line)"/>
  <rect x="20" y="696" width="3" height="813" fill="var(--l4)"/>
  <text x="38" y="722" class="t-band" fill="var(--l4)">逐层计算 + 逐层传输 · P 每算完一层就发一层</text>
  <text x="38" y="742" class="t-sub">与 layer i+1 的计算重叠；D 侧逐层把 KV 拉进自己的池子</text>
  <rect x="34" y="760" width="1132" height="723" rx="9" fill="none" stroke="var(--line-2)" stroke-dasharray="6 5"/>
  <text x="50" y="784" class="t-mono" style="fill:var(--ink-2)"><tspan font-weight="600">loop 每个 layer i</tspan> · N 个有 KV 的逻辑层 = I 个独享 buffer + min(B, R) 个共享 buffer</text>
  <rect x="20" y="1541" width="1160" height="216" rx="10" fill="var(--l4)" fill-opacity=".05" stroke="var(--line)"/>
  <rect x="20" y="1541" width="3" height="216" fill="var(--l4)"/>
  <text x="38" y="1567" class="t-band" fill="var(--l4)">终态判定 · 请求完成与 buffer 完成是两件事</text>
  <text x="38" y="1587" class="t-sub">物理 buffer 完成保护 P 的内存复用；请求完成才决定 D 何时开始推理</text>
  <text x="214" y="229" class="t-mono" text-anchor="middle" style="fill:var(--ink-2)"><tspan class="t-mono-c">①&#160;</tspan> 请求（Cli → Prx）</text>
  <line x1="123" y1="250" x2="303" y2="250" class="t-line" marker-end="url(#lfa)"/>
  <text x="406" y="281" class="t-mono" text-anchor="middle" style="fill:var(--ink-2)"><tspan class="t-mono-c">②&#160;</tspan> 路由到 D（do_remote_prefill=true）</text>
  <line x1="316" y1="302" x2="496" y2="302" class="t-line" marker-end="url(#lfa)"/>
  <rect x="406" y="318" width="194" height="62" rx="7" fill="var(--panel)" stroke="var(--line-2)"/>
  <rect x="406" y="318" width="3" height="62" fill="var(--l3)"/>
  <text x="418" y="334" class="t-mono" style="fill:var(--ink-2)"><tspan class="t-mono-c">③&#160;</tspan> 剩余 prompt 报告为异步匹配</text>
  <text x="418" y="350" class="t-mono" style="fill:var(--ink-2)">vLLM 分配 main host pool 块</text>
  <text x="418" y="366" class="t-mono" style="fill:var(--ink-2)">+ indexer NPU 块</text>
  <rect x="391" y="392" width="224" height="46" rx="7" fill="var(--wash)" stroke="var(--line)"/>
  <text x="403" y="408" class="t-mono" style="fill:var(--muted)">原图 Note：D 的 block id</text>
  <text x="403" y="424" class="t-mono" style="fill:var(--muted)">永远不出 D 节点</text>
  <text x="406" y="469" class="t-mono" text-anchor="middle" style="fill:var(--ink-2)"><tspan class="t-mono-c">④&#160;</tspan> 广播 endpoint / 端口 / TP 拓扑 / 已缓存 token 数</text>
  <line x1="497" y1="490" x2="317" y2="490" class="t-line" marker-end="url(#lfa)"/>
  <rect x="406" y="506" width="194" height="30" rx="7" fill="var(--panel)" stroke="var(--line-2)"/>
  <rect x="406" y="506" width="3" height="30" fill="var(--l3)"/>
  <text x="418" y="522" class="t-mono" style="fill:var(--ink-2)"><tspan class="t-mono-c">⑤&#160;</tspan> 清掉 do_remote_prefill</text>
  <text x="600" y="595" class="t-mono" text-anchor="middle" style="fill:var(--ink-2)"><tspan class="t-mono-c">⑥&#160;</tspan> 转发到 P（do_remote_decode=true）</text>
  <line x1="316" y1="616" x2="883" y2="616" class="t-line" marker-end="url(#lfa)"/>
  <rect x="793" y="632" width="194" height="46" rx="7" fill="var(--panel)" stroke="var(--line-2)"/>
  <rect x="793" y="632" width="3" height="46" fill="var(--l3)"/>
  <text x="805" y="648" class="t-mono" style="fill:var(--ink-2)"><tspan class="t-mono-c">⑦&#160;</tspan> 记下 P 侧 source block id</text>
  <text x="805" y="664" class="t-mono" style="fill:var(--ink-2)">D endpoint / 已传 token 数</text>
  <rect x="986" y="824" width="194" height="62" rx="7" fill="var(--panel)" stroke="var(--line-2)"/>
  <rect x="986" y="824" width="3" height="62" fill="var(--l3)"/>
  <text x="998" y="840" class="t-mono" style="fill:var(--ink-2)"><tspan class="t-mono-c">⑧&#160;</tspan> wait_for_layer_load(i)</text>
  <text x="998" y="856" class="t-mono" style="fill:var(--ink-2)">从 ① Memcache 加载前缀层</text>
  <text x="998" y="872" class="t-mono" style="fill:var(--ink-2)">（需先等 buffer 可安全覆盖）</text>
  <rect x="986" y="898" width="194" height="46" rx="7" fill="var(--panel)" stroke="var(--line-2)"/>
  <rect x="986" y="898" width="3" height="46" fill="var(--l3)"/>
  <text x="998" y="914" class="t-mono" style="fill:var(--ink-2)"><tspan class="t-mono-c">⑨&#160;</tspan> attention 计算</text>
  <text x="998" y="930" class="t-mono" style="fill:var(--ink-2)">KV 写入共享物理 buffer</text>
  <rect x="986" y="956" width="194" height="46" rx="7" fill="var(--panel)" stroke="var(--line-2)"/>
  <rect x="986" y="956" width="3" height="46" fill="var(--l3)"/>
  <text x="998" y="972" class="t-mono" style="fill:var(--ink-2)"><tspan class="t-mono-c">⑩&#160;</tspan> scatter 完成 →</text>
  <text x="998" y="988" class="t-mono" style="fill:var(--ink-2)">save_kv_layer(i)</text>
  <text x="50" y="1030" class="t-mono" style="fill:var(--l3)"><tspan font-weight="600">par 双路并行</tspan> · save 回 ① 与 通知 D 来拉，同一层同时发生</text>
  <text x="696" y="1073" class="t-mono" text-anchor="middle" style="fill:var(--ink-2)"><tspan class="t-mono-c">⑪&#160;</tspan> AscendStore 异步 save 到 ①（Memcache）</text>
  <line x1="1077" y1="1094" x2="317" y2="1094" class="t-line" marker-end="url(#lfa)"/>
  <text x="890" y="1139" class="t-mono" text-anchor="middle" style="fill:var(--ink-2)"><tspan class="t-mono-c">⑫&#160;</tspan> send_thread 发 READ_READY_BATCH</text>
  <text x="890" y="1155" class="t-mono" text-anchor="middle" style="fill:var(--ink-2)">(layer_idx, 块id, 偏移)</text>
  <line x1="1077" y1="1120" x2="704" y2="1120" class="t-line" marker-end="url(#lfa)"/>
  <rect x="600" y="1177" width="194" height="78" rx="7" fill="var(--panel)" stroke="var(--line-2)"/>
  <rect x="600" y="1177" width="3" height="78" fill="var(--l3)"/>
  <text x="612" y="1193" class="t-mono" style="fill:var(--ink-2)"><tspan class="t-mono-c">⑬&#160;</tspan> 校验 main/indexer/LIC8</text>
  <text x="612" y="1209" class="t-mono" style="fill:var(--ink-2)">尺寸与目标块范围</text>
  <text x="612" y="1225" class="t-mono" style="fill:var(--ink-2)">不匹配则整层失败</text>
  <text x="612" y="1241" class="t-mono" style="fill:var(--ink-2)">不残留半份数据</text>
  <rect x="600" y="1267" width="194" height="62" rx="7" fill="var(--panel)" stroke="var(--line-2)"/>
  <rect x="600" y="1267" width="3" height="62" fill="var(--l3)"/>
  <text x="612" y="1283" class="t-mono" style="fill:var(--ink-2)"><tspan class="t-mono-c">⑭&#160;</tspan> MemFabric 批量读</text>
  <text x="612" y="1299" class="t-mono" style="fill:var(--ink-2)">main KV → ③ D host pool</text>
  <text x="612" y="1315" class="t-mono" style="fill:var(--ink-2)">indexer → ④ D NPU</text>
  <text x="890" y="1356" class="t-mono" text-anchor="middle" style="fill:var(--ink-2)"><tspan class="t-mono-c">⑮&#160;</tspan> READ_DONE(i) 或 READ_FAILED(i)</text>
  <line x1="703" y1="1377" x2="1076" y2="1377" class="t-line" stroke-dasharray="6 4" marker-end="url(#lfa)"/>
  <rect x="986" y="1393" width="194" height="78" rx="7" fill="var(--panel)" stroke="var(--line-2)"/>
  <rect x="986" y="1393" width="3" height="78" fill="var(--l3)"/>
  <text x="998" y="1409" class="t-mono" style="fill:var(--ink-2)"><tspan class="t-mono-c">⑯&#160;</tspan> 该物理 slot 的</text>
  <text x="998" y="1425" class="t-mono" style="fill:var(--ink-2)">storage_send_done_events 置位</text>
  <text x="998" y="1441" class="t-mono" style="fill:var(--ink-2)">（等所有 TP contributor +</text>
  <text x="998" y="1457" class="t-mono" style="fill:var(--ink-2)">Memcache save 都完成才可复用）</text>
  <rect x="406" y="1605" width="194" height="46" rx="7" fill="var(--panel)" stroke="var(--line-2)"/>
  <rect x="406" y="1605" width="3" height="46" fill="var(--l3)"/>
  <text x="418" y="1621" class="t-mono" style="fill:var(--ink-2)"><tspan class="t-mono-c">⑰&#160;</tspan> 全部层 + 所有 rank 到达终态</text>
  <text x="418" y="1637" class="t-mono" style="fill:var(--ink-2)">→ 请求才可被调度进 decode</text>
  <rect x="391" y="1663" width="224" height="78" rx="7" fill="var(--wash)" stroke="var(--line)"/>
  <text x="403" y="1679" class="t-mono" style="fill:var(--muted)">原图 Note：物理 buffer 完成</text>
  <text x="403" y="1695" class="t-mono" style="fill:var(--muted)">≠ 请求完成（两件事）</text>
  <text x="403" y="1711" class="t-mono" style="fill:var(--muted)">前者保护 P 内存复用</text>
  <text x="403" y="1727" class="t-mono" style="fill:var(--muted)">后者控制 D 何时开始推理</text>
</svg>
